[project]
name = "soiling-analysis"
version = "0.1.0"
description = "PV string soiling, curtailment and degradation diagnostics pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pvlib>=0.15.2",
    "pyarrow>=24.0.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
]

[project.scripts]
soiling = "soiling_analysis.cli:main"
soiling-fetch = "soiling_analysis.mongo_export.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["*_test.py"]
